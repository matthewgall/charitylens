# fly.toml
app = 'charitylens'
primary_region = 'lhr'

[build]
  dockerfile = 'Dockerfile.fly'

[env]
  DATABASE_TYPE = "sqlite"
  DATABASE_URL = "/app/charityseeder.db"
  PORT = "8080"
  OFFLINE_MODE = "true"

[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.tcp_checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
